    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.47.1
    prebuild:
      - rm assets/models/maia3-79m.onnx
      - wget -O assets/models/maia3-79m.onnx https://media.githubusercontent.com/media/Dash1971/maia-chess-android/989d6a3e606362a089fc442070ea37121776bf15/assets/models/maia3-79m.onnx
      - echo '3454b03ae78baa64a87b345fdb1a457265d912caec531039b074f07eda0d8010  assets/models/maia3-79m.onnx' | sha256sum -c -
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scanignore:
      - assets/models/maia3-79m.onnx
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
      - $$flutter$$/bin/flutter build apk --release

