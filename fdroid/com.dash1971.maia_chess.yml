Builds:
  - versionName: 2.1.2
    versionCode: 75
    commit: ebe11cf1c2e973fa50eb99391181c29d2f545937
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.47.1
    prebuild:
      - rm assets/models/maia3-79m.onnx
      - curl -sL -o assets/models/maia3-79m.onnx https://media.githubusercontent.com/media/Dash1971/maia-chess-android/ebe11cf1c2e973fa50eb99391181c29d2f545937/assets/models/maia3-79m.onnx
      - echo '3454b03ae78baa64a87b345fdb1a457265d912caec531039b074f07eda0d8010  assets/models/maia3-79m.onnx' | sha256sum -c -
      - export PUB_CACHE=$(pwd)/.pub-cache
      - python3 tool/prepare_reproducible_flutter_sdk.py --flutter-root $$flutter$$
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - python3 tool/prepare_reproducible_stockfish.py --package-config .dart_tool/package_config.json
      - python3 tool/verify_model.py
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
      - $$flutter$$/bin/flutter build apk --release --config-only
      - $$flutter$$/bin/dart tool/prepare_reproducible_package_config.dart .dart_tool/package_config.json
      - $$flutter$$/bin/flutter build apk --release --no-pub --android-project-arg=mobileMaiaSourceDateEpoch=$SOURCE_DATE_EPOCH

AllowedAPKSigningKeys: cd6c07c4efacf52bcccb83009b522c1dcad4a171197505a486f0a58edb6f172e

AutoUpdateMode: Version
UpdateCheckMode: Tags
