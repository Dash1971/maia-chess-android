Builds:
  - versionName: 2.1.1
    versionCode: 74
    commit: a638f5c7552eebe69fed986f832520493ac8a16c
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.47.1
    prebuild:
      - rm assets/models/maia3-79m.onnx
      - wget -O assets/models/maia3-79m.onnx https://media.githubusercontent.com/media/Dash1971/maia-chess-android/a638f5c7552eebe69fed986f832520493ac8a16c/assets/models/maia3-79m.onnx
      - echo '3454b03ae78baa64a87b345fdb1a457265d912caec531039b074f07eda0d8010  assets/models/maia3-79m.onnx' | sha256sum -c -
      - export PUB_CACHE=$(pwd)/.pub-cache
      - python3 tool/prepare_reproducible_flutter_sdk.py --flutter-root $$flutter$$
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - python3 tool/verify_model.py
    scanignore:
      - assets/models/maia3-79m.onnx
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
      - $$flutter$$/bin/flutter build apk --release --config-only
      - $$flutter$$/bin/dart tool/prepare_reproducible_package_config.dart .dart_tool/package_config.json
      - $$flutter$$/bin/flutter build apk --release --no-pub --android-project-arg=mobileMaiaSourceDateEpoch=$SOURCE_DATE_EPOCH

