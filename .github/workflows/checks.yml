name: Checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_android:
        description: Build and verify the unsigned release APK
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Flutter
        run: |
          git clone --depth 1 --branch 3.47.1 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = 6655482ec06e547f90abf8ae7590466f4415978d
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test --reporter expanded
      - name: Test release verification tools
        run: |
          python3 -m venv "$RUNNER_TEMP/release-checks-venv"
          "$RUNNER_TEMP/release-checks-venv/bin/pip" install -r tool/hardening/requirements.txt
          "$RUNNER_TEMP/release-checks-venv/bin/python" -m unittest discover -s tool -p '*_test.py'
  android:
    if: github.event_name == 'workflow_dispatch' && inputs.build_android
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Flutter
        run: |
          git clone --depth 1 --branch 3.47.1 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = 6655482ec06e547f90abf8ae7590466f4415978d
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: python3 tool/verify_model.py
      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          mkdir -p release-checks
          tool/build_android_release.sh 2>&1 | tee release-checks/build.log
      - name: Verify release packaging
        run: |
          python3 tool/verify_release_apk.py build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            --output release-checks/apk.json
      - name: Upload verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-verification
          path: release-checks/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-android-release
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 14
