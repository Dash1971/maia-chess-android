name: Checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_android:
        description: Build and verify the unsigned release APK
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Flutter
        run: |
          git clone --depth 1 --branch 3.47.1 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = 6655482ec06e547f90abf8ae7590466f4415978d
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test --reporter expanded
      - run: python3 -m unittest discover -s tool -p '*_test.py'
  android:
    if: github.event_name == 'workflow_dispatch' && inputs.build_android
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Flutter
        run: |
          git clone --depth 1 --branch 3.47.1 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = 6655482ec06e547f90abf8ae7590466f4415978d
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: python3 tool/verify_model.py
      - run: tool/build_android_release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-android-release
          path: build/app/outputs/flutter-apk/app-release.apk
