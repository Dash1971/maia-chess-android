name: Checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_android:
        description: Build and verify the unsigned release APK
        type: boolean
        default: false
      expected_source_sha:
        description: Full source commit expected for the Android release build
        type: string
        required: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Flutter
        run: |
          git clone --depth 1 --branch 3.47.1 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = 6655482ec06e547f90abf8ae7590466f4415978d
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test --reporter expanded
      - name: Test release verification tools
        run: |
          python3 -m venv "$RUNNER_TEMP/release-checks-venv"
          "$RUNNER_TEMP/release-checks-venv/bin/pip" install -r tool/hardening/requirements.txt
          "$RUNNER_TEMP/release-checks-venv/bin/python" -m unittest discover -s tool -p '*_test.py'
  android:
    if: github.event_name == 'workflow_dispatch' && inputs.build_android
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Verify requested source commit
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        run: |
          set -euo pipefail
          test "$EXPECTED_SOURCE_SHA" = "$(git rev-parse HEAD)"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Flutter
        run: |
          git clone --depth 1 --branch 3.47.1 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = 6655482ec06e547f90abf8ae7590466f4415978d
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: python3 tool/verify_model.py
      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          mkdir -p release-checks
          tool/build_android_release.sh 2>&1 | tee release-checks/build.log
      - name: Verify release packaging
        run: |
          python3 tool/verify_release_apk.py build/app/outputs/flutter-apk/app-release.apk \
            --allow-abi armeabi-v7a --allow-abi arm64-v8a --allow-abi x86_64 \
            --output release-checks/apk.json
      - name: Record Linux build provenance
        shell: bash
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-release.apk
          flutter_extension="$RUNNER_TEMP/flutter/packages/flutter_tools/gradle/src/main/kotlin/FlutterExtension.kt"
          ndk_version=$(awk -F'"' '/ndkVersion: String = "/ { print $2; exit }' "$flutter_extension")
          test -n "$ndk_version"
          sdk_root=${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}
          test -n "$sdk_root"
          ndk_root="$sdk_root/ndk/$ndk_version"
          clang_bin=$(find "$ndk_root/toolchains/llvm/prebuilt" -path '*/bin/clang' -print -quit)
          test -n "$clang_bin"
          sha256sum "$apk" | sed 's#  .*#  app-release.apk#' > release-checks/app-release.apk.sha256
          {
            echo "source_commit=$(git rev-parse HEAD)"
            echo "source_date_epoch=$(git log -1 --format=%ct)"
            echo "workflow_run=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            . /etc/os-release
            echo "runner_distribution=$PRETTY_NAME"
            echo "flutter_ndk_version=$ndk_version"
            grep -E '^(Pkg.Desc|Pkg.Revision) = ' "$ndk_root/source.properties"
            echo
            flutter --version
            echo
            java -version 2>&1
            echo
            "$clang_bin" --version
          } > release-checks/build-environment.txt
      - name: Upload verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-verification-${{ github.sha }}
          path: release-checks/
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-android-release-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90
