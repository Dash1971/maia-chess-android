# Explicit Markdown: the Android store does not render Fastlane HTML.
description: |
  **By Maia fans, for Maia fans.** Mobile Maia is a free, open-source community project for playing and studying chess with Maia on Android. No ads, subscriptions or daily analysis limits.

  Maia-3 79M and Stockfish run locally on your phone, without an account or Internet connection. Choose a Maia rating from 600 to 2600 to explore human-like moves; the rating is not a guaranteed playing strength.

  **Play at your own pace**

  - Choose your side, time control, takebacks and rematches.
  - Adjust move variety, opening variety and human move timing. Timing defaults on when unset, including after upgrading; a saved off choice stays off.
  - Recover unfinished games from Recent games, including after opening another game or importing PGN.

  **Understand your games**

  - Compare two Maia ratings with Stockfish, including move probabilities and optional expected-score estimates.
  - Run full-game analysis with an evaluation graph, accuracy scores and move annotations.
  - Keep engine analysis visible while scrolling or jumping through moves.
  - Resume unfinished analysis after returning to the same open Review screen.
  - Explore variations, edit positions and continue playing from a position you choose.

  **Keep your chess on your phone**

  - Import PGN games or FEN positions and save or share games with supported comments and variations.
  - Transfer PGN collections between installations: import and export up to 5 MiB. Collections are added to Recent games; single games open for analysis.
  - Browse compact game-history rows and return from saved games without losing your list position.
  - Use larger landscape boards and adaptive layouts on wider screens.
  - Choose from ten interface languages, light/dark themes, system colors, a pure-black background, board designs, piece sets and move aids.
  - Optionally export Maia's move probabilities and choices as a readable offline report.

  **Electronic-board play**

  Chessnut Air and Go connect over Bluetooth for untimed games; lights guide setup and Maia's moves. You can also continue from an analysis position on Chessnut.

  Experimental Square Off Grand Kingdom support allows untimed games from the standard position. Maia promotions require physical piece replacement and confirmation. Interrupted motor movement and takebacks use phone continuation. DGT Pegasus is not available in Stable.

  On Android 11 and older, Bluetooth board discovery needs location permission; the app does not use it to determine your location. Android 12 and newer use Nearby devices permissions. On-screen chess needs neither.

  Mobile Maia has no telemetry, analytics or tracking. Games and analysis stay on your device unless you choose to export or share them. Camera/image board recognition is not included.

  **Before you download**

  The download is several hundred megabytes because the Maia-3 79M model is bundled for offline use.

  Mobile Maia is an independent community project under AGPL-3.0-only. It uses Maia-3 from the University of Toronto's Computational Social Science Lab and Stockfish. Its interface and development philosophy are informed by Lichess. Review classification and sacrifice heuristics are adapted from En Croissant. It is not an official Maia Chess, University of Toronto CSSLab, Lichess, Stockfish, En Croissant, Chessnut or Square Off app.
