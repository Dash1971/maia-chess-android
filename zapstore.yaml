# Explicit Markdown: the Android store does not render Fastlane HTML.
description: |
  By Maia fans, for Maia fans. Mobile Maia is an offline chess app for Android using the latest Maia-3 79M engine and Stockfish.

  Choose a Maia rating from 600 to 2600 to play against and analyze human-like moves at different playing strengths.

  - Full-game analysis with evaluation graphs, accuracy scores and move annotations (including brilliant moves!!).
  - Save analysis in PGN and restore it when reopening games.
  - Import and export PGN collections, with or without analysis.
  - Analysis board with opening names and multiple colored arrows to easily compare Stockfish and Maia analysis.
  - Edit positions, explore variations and continue playing from a chosen position.
  - Full set of Lichess time controls or choose a custom time control.
  - Use takebacks, agree to draws, and stack chess.com style multiple premoves.
  - Phone and tablet layouts, ten languages, and customizable boards and themes.
  - Bluetooth eboard play with Chessnut Air, Go, Pro and Square Off Grand Kingdom. Chessnut Pro is supported but not fully tested.

  Free and open source under AGPL-3.0-only. The Maia-3 79M model is included for offline use.
