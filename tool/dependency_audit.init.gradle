// Read-only dependency resolution for release audits. No APK/model build needed.
import groovy.json.JsonOutput
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.api.artifacts.result.UnresolvedDependencyResult

gradle.projectsEvaluated {
    def app = gradle.rootProject.findProject(':app')
    if (app == null) return // Ignore Flutter's included Gradle build.
    app.tasks.register('writeReleaseDependencyAudit') {
        doLast {
            def resolution = app.configurations.getByName('releaseRuntimeClasspath').incoming.resolutionResult
            def unresolved = resolution.allDependencies.findAll { it instanceof UnresolvedDependencyResult }
            if (!unresolved.isEmpty()) {
                throw new GradleException('Incomplete release dependency graph: ' + unresolved*.attempted)
            }
            def packages = resolution.allComponents.collect { component ->
                def id = component.id
                id instanceof ModuleComponentIdentifier ?
                    [ecosystem: 'Maven', name: "${id.group}:${id.module}", version: id.version] : null
            }.findAll { it != null }.unique().sort { a, b -> a.name <=> b.name }
            if (packages.isEmpty()) throw new GradleException('Empty release dependency graph')
            def output = new File(gradle.rootProject.projectDir, '../release-checks/maven-dependencies.json')
            output.parentFile.mkdirs()
            output.text = JsonOutput.prettyPrint(JsonOutput.toJson([
                schema: 1, configuration: 'releaseRuntimeClasspath', packages: packages
            ])) + '\n'
        }
    }
}
